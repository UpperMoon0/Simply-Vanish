plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
group = 'io.github.uppermoon0.simplyvanish'
version = '0.1.0'
base { archivesName = 'simply-vanish-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { simplyvanish { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral(); maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
mixin { add sourceSets.main, 'simplyvanish.refmap.json'; config 'simplyvanish.mixins.json' }
test { useJUnitPlatform() }
jar { manifest { attributes 'MixinConfigs': 'simplyvanish.mixins.json' }; finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
